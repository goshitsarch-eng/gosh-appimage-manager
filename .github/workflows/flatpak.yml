# Autobuild the Flatpak for x86_64 and aarch64.
#
# The build needs ~15 GB for the 23.08 SDK plus several GB of Rust/Flatpak
# build cache, far more than the ~10 GB free on a stock GitHub runner
# (both arches died with "No space left on device"). Everything therefore
# runs on the host -- not in the flatpak-github-actions container image --
# so the free-disk-space step actually reclaims host disk. aarch64 builds
# under qemu-user-static and is much slower; fail-fast is off so one arch
# never cancels the other.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: Flatpak

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.arch == 'aarch64' && 360 || 120 }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # flatpak-builder installs SDK deps with --system, so the remote
          # must exist system-wide, not just for the user.
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install qemu-user-static
        if: ${{ matrix.arch != 'x86_64' }}
        run: sudo apt-get install -y qemu-user-static

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            build-dir packaging/com.goshapps.AppImageManager.yml \
            --arch=${{ matrix.arch }}

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle repo \
            gosh-appimage-manager-${{ matrix.arch }}.flatpak \
            com.goshapps.AppImageManager

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: gosh-appimage-manager-${{ matrix.arch }}.flatpak
          path: gosh-appimage-manager-${{ matrix.arch }}.flatpak
