# Autobuild the Flatpak for x86_64 and aarch64.
# aarch64 builds run under QEMU emulation (see flatpak-builder action docs),
# so they are slower; fail-fast is off so one arch never cancels the other.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: Flatpak

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      # Docker is required by the docker/setup-qemu-action which enables emulation
      - name: Install deps
        if: ${{ matrix.arch != 'x86_64' }}
        run: |
          # Use the static binaries because it's unable to use a package manager
          curl https://download.docker.com/linux/static/stable/x86_64/docker-26.0.0.tgz --output ./docker.tgz
          tar xzvf docker.tgz
          mv docker/* /usr/bin
      - name: Set up QEMU
        if: ${{ matrix.arch != 'x86_64' }}
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gosh-appimage-manager-${{ matrix.arch }}.flatpak
          manifest-path: packaging/com.goshapps.AppImageManager.yml
          arch: ${{ matrix.arch }}
          artifact-name: gosh-appimage-manager-${{ matrix.arch }}.flatpak
