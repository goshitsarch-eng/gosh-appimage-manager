[package]
name = "gosh-appimage-manager"
version = "3.0.0"
edition = "2021"
description = "Gosh AppImage Manager — inspect, integrate, update and remove AppImages. Made by Gosh."
license = "GPL-3.0-or-later"
homepage = "https://goshapps.com"
repository = "https://github.com/goshitsarch-eng/gosh-appimage-manager"
authors = ["Gosh Apps / Gosh-Its-Arch"]
rust-version = "1.75"

[lib]
name = "goshaim_core"
path = "src/lib.rs"

[[bin]]
name = "gosh-appimage-manager"
path = "src/main.rs"

[features]
default = []
# COSMIC Epoch GUI (libcosmic, iced-based). Enabled in the Flatpak build.
# Requires network (git checkout) on first build.
gui = ["dep:libcosmic", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
trash = "5"
notify-rust = "4"
wait-timeout = "0.2"
libcosmic = { git = "https://github.com/pop-os/libcosmic", tag = "v0.12", optional = true, default-features = false, features = ["tokio", "winit", "wgpu", "a11y", "xdg-portal", "single-instance"] }
# GUI only: long-running work (hashing, extraction, network, downloads) runs on
# a blocking worker so the window keeps repainting. libcosmic already runs on
# tokio; this is the handle to its blocking pool.
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

# libcosmic v0.12's vendored iced tracks cosmic-text by git branch (which has
# since moved API). Redirect it to the contemporary crates.io release so the
# text APIs match. Verified by `cargo check --features gui`.
[patch."https://github.com/pop-os/cosmic-text.git"]
cosmic-text = "=0.13.2"
