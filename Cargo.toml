[package]
name = "gosh-appimage-manager"
version = "3.0.1"
edition = "2021"
description = "Gosh AppImage Manager — inspect, integrate, update and remove AppImages. Made by Gosh."
license = "GPL-3.0-or-later"
homepage = "https://goshapps.com"
repository = "https://github.com/goshitsarch-eng/gosh-appimage-manager"
authors = ["Gosh Apps / Gosh-Its-Arch"]
rust-version = "1.89"

[lib]
name = "goshaim_core"
path = "src/lib.rs"

[[bin]]
name = "gosh-appimage-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
trash = "5"
notify-rust = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
