id: com.goshapps.AppImageManager
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gosh-appimage-manager
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Notifications
  - --own-name=com.goshapps.AppImageManager
  - --filesystem=~/AppImages:create
  - --filesystem=~/.local/share/applications:create
  - --filesystem=~/.local/share/icons:create
  - --filesystem=~/.local/share/gosh-appimage-manager:create
  - --filesystem=xdg-config/autostart:create
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # The 23.08 dwz/debugedit predate rustc 1.90's DWARF and corrupt libLLVM
  # while splitting debuginfo (zeroed program headers). The pinned toolchain
  # in /app/rust must never go through post-processing; release binaries
  # carry no debuginfo anyway.
  no-debuginfo: true
  # qemu-user aarch64 compilation is memory-hungry; cap cargo parallelism
  # on that arch so the build survives on desktop machines.
  arch:
    aarch64:
      env:
        CARGO_BUILD_JOBS: '4'
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /rust
modules:
  # Pinned Rust 1.90.0: the 23.08 SDK extension ships Rust 1.81, which is
  # older than this dependency graph needs (up to 1.89). The toolchain is
  # removed from the final app by the top-level /rust cleanup above.
  - name: rust-gosh
    buildsystem: simple
    build-commands:
      - echo "Installing pinned Rust 1.90.0 toolchain (cache-buster v4)"
      - tar -xf rust-toolchain.tar.gz
      - ./rust-1.90.0-*/install.sh --prefix=${FLATPAK_DEST}/rust --without=rust-docs
      - ${FLATPAK_DEST}/rust/bin/rustc -vV
    cleanup:
      - rust-toolchain.tar.gz
      - rust-1.90.0-*
    sources:
      - type: file
        url: https://static.rust-lang.org/dist/rust-1.90.0-x86_64-unknown-linux-gnu.tar.gz
        sha256: e453bae1c68d02fe2eae065c5452d5731308164cd154154c6ee442d2fa590685
        dest-filename: rust-toolchain.tar.gz
        only-arches:
          - x86_64
      - type: file
        url: https://static.rust-lang.org/dist/rust-1.90.0-aarch64-unknown-linux-gnu.tar.gz
        sha256: 293f412e3412c3aa3398c78ebbdf898fa08eacad80c85a7332ce1a455504c5fc
        dest-filename: rust-toolchain.tar.gz
        only-arches:
          - aarch64
  - name: unsquashfs
    buildsystem: simple
    build-commands:
      - XZ_SUPPORT=1 ZSTD_SUPPORT=1 LZ4_SUPPORT=1 make -C squashfs-tools -j ${FLATPAK_BUILDER_N_JOBS} unsquashfs
      - install -Dm755 squashfs-tools/unsquashfs -t ${FLATPAK_DEST}/bin/
      - install -Dm644 COPYING ${FLATPAK_DEST}/share/gosh-appimage-manager/licenses/squashfs-tools/COPYING
    sources:
      - type: archive
        url: https://github.com/plougher/squashfs-tools/archive/refs/tags/4.6.1.tar.gz
        sha256: 9c4974e07c61547dae14af4ed1f358b7d04618ae194e54d6be72ee126f0d2f53
        strip-components: 1
  - name: 7zip
    buildsystem: simple
    build-commands:
      - tar -xf 7z/7z.tar.xz -C 7z
      - install -Dm755 7z/7zz -t ${FLATPAK_DEST}/bin/
      - install -Dm644 License.txt ${FLATPAK_DEST}/share/gosh-appimage-manager/licenses/7zip/License.txt
      - install -Dm644 7z2600-src.tar.xz ${FLATPAK_DEST}/share/gosh-appimage-manager/corresponding-source/7z2600-src.tar.xz
    cleanup:
      - 7z
    sources:
      - type: file
        url: https://github.com/ip7z/7zip/releases/download/26.00/7z2600-linux-x64.tar.xz
        sha256: c74dc4a48492cde43f5fec10d53fb2a66f520e4a62a69d630c44cb22c477edc6
        dest: 7z
        dest-filename: 7z.tar.xz
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/ip7z/7zip/releases/download/26.00/7z2600-linux-arm64.tar.xz
        sha256: aa8f3d0a19af9674d3af0ec788b4e261501071e626cd75ad149f1c2c176cc87d
        dest: 7z
        dest-filename: 7z.tar.xz
        only-arches:
          - aarch64
      - type: file
        url: https://github.com/ip7z/7zip/releases/download/26.00/7z2600-src.tar.xz
        sha256: 3e596155744af055a77fc433c703d54e3ea9212246287b5b1436a6beac060f16
        dest-filename: 7z2600-src.tar.xz
      - type: file
        path: ../third_party/licenses/7zip/License.txt
  - name: dwarfs
    buildsystem: simple
    cleanup:
      - dwarfs
    build-commands:
      - install -Dm755 dwarfs/bin/dwarfsextract -t ${FLATPAK_DEST}/bin/
      - install -Dm755 dwarfs/bin/dwarfsck -t ${FLATPAK_DEST}/bin/
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/gosh-appimage-manager/licenses/dwarfs/LICENSE
      - install -Dm644 GPL-3.0-or-later.txt ${FLATPAK_DEST}/share/gosh-appimage-manager/licenses/dwarfs/GPL-3.0-or-later.txt
      - install -Dm644 dwarfs-0.15.3.tar.gz ${FLATPAK_DEST}/share/gosh-appimage-manager/corresponding-source/dwarfs-0.15.3.tar.gz
    sources:
      - type: archive
        sha256: 2dba61946786ec563c96783f719316199eeb55a4cbde1436e1b5796f28494fa8
        url: https://github.com/mhx/dwarfs/releases/download/v0.15.3/dwarfs-0.15.3-Linux-x86_64.tar.xz
        dest: dwarfs
        only-arches:
          - x86_64
      - type: archive
        sha256: 70edc89104233aa8afe7548c4b83c97625baf44c34f625fa99deff4b4b01f89f
        url: https://github.com/mhx/dwarfs/releases/download/v0.15.3/dwarfs-0.15.3-Linux-aarch64.tar.xz
        dest: dwarfs
        only-arches:
          - aarch64
      - type: file
        url: https://github.com/mhx/dwarfs/archive/refs/tags/v0.15.3.tar.gz
        sha256: 63919bb7c1df16c17210dd15e5028c44b813bbd422b9067bd4a43344bcff9a96
        dest-filename: dwarfs-0.15.3.tar.gz
      - type: file
        path: ../third_party/licenses/dwarfs/LICENSE
      - type: file
        path: ../third_party/licenses/dwarfs/GPL-3.0-or-later.txt
  - name: gosh-appimage-manager
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/gosh-appimage-manager/cargo
        CARGO_NET_OFFLINE: 'true'
        RUSTC: /app/rust/bin/rustc
    build-commands:
      - /app/rust/bin/cargo --offline fetch --manifest-path Cargo.toml
      - /app/rust/bin/cargo --offline build --release --features gui
      - install -Dm755 target/release/gosh-appimage-manager -t ${FLATPAK_DEST}/bin/
      - install -Dm644 data/com.goshapps.AppImageManager.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 data/com.goshapps.AppImageManager.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 data/icons/hicolor/scalable/apps/com.goshapps.AppImageManager.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/
      - install -Dm644 data/icons/hicolor/symbolic/apps/com.goshapps.AppImageManager-symbolic.svg -t ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/
      - install -Dd ${FLATPAK_DEST}/share/gosh-appimage-manager/i18n/
      - install -m644 -t ${FLATPAK_DEST}/share/gosh-appimage-manager/i18n/ i18n/*.json
      - install -Dm644 i18n/README.md ${FLATPAK_DEST}/share/gosh-appimage-manager/i18n/README.md
      - install -Dm644 COPYING ${FLATPAK_DEST}/share/gosh-appimage-manager/COPYING
      - install -Dm644 AUTHORS ${FLATPAK_DEST}/share/gosh-appimage-manager/AUTHORS
      - cp -r third_party/licenses ${FLATPAK_DEST}/share/gosh-appimage-manager/licenses
      - ./target/release/gosh-appimage-manager --self-test
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
          - repo
          - .git
          - .grok
          - screenshots
      - cargo-sources.json
